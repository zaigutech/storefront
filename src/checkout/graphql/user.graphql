fragment AccountErrorFragment on AccountError {
	message
	field
	code
}

fragment UserFragment on User {
	id
	email
	addresses {
		...AddressFragment
	}
	defaultBillingAddress {
		...AddressFragment
	}
	defaultShippingAddress {
		...AddressFragment
	}
}

query user {
	user: me {
		...UserFragment
	}
}

mutation userAddressDelete($id: ID!) {
	accountAddressDelete(id: $id) {
		user {
			...UserFragment
		}
		errors {
			...AccountErrorFragment
		}
		address {
			...AddressFragment
		}
	}
}
mutation userAddressUpdate($id: ID!, $address: AddressInput!) {
	accountAddressUpdate(id: $id, input: $address) {
		user {
			...UserFragment
		}
		errors {
			...AccountErrorFragment
		}
		address {
			...AddressFragment
		}
	}
}

mutation userAddressCreate($address: AddressInput!, $type: AddressTypeEnum) {
	accountAddressCreate(type: $type, input: $address) {
		user {
			...UserFragment
		}
		errors {
			...AccountErrorFragment
		}
		address {
			...AddressFragment
		}
	}
}

mutation userSetDefaultAddress($id: ID!, $type: AddressTypeEnum!) {
	accountSetDefaultAddress(id: $id, type: $type) {
		user {
			...UserFragment
		}
		errors {
			...AccountErrorFragment
		}
	}
}
